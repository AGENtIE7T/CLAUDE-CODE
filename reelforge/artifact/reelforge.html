<style>
/* Layout: one narrow phone-first column; a dark "clapperboard" hook slate is the one loud element per script. */
:root {
  --bg: #f7f5f6; --surface: #ffffff; --surface-2: #f0ecee; --line: #e3dde0;
  --fg: #19151a; --fg-soft: #5d5560; --fg-faint: #918893;
  --accent: #e8285a; --accent-ink: #ffffff; --accent-soft: #fde7ed;
  --slate: #17121a; --slate-fg: #fbf7f9; --slate-soft: rgba(255,255,255,.1);
  --good: #0f8a5f; --good-soft: #e3f5ec; --warn: #b36b00; --warn-soft: #fff3dc; --bad: #c62a32; --bad-soft: #fde8e8;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f0c10; --surface: #19151b; --surface-2: #231e25; --line: #2f2931;
  --fg: #f4eff3; --fg-soft: #b6acb5; --fg-faint: #7c727c;
  --accent: #ff4d7a; --accent-ink: #1a0910; --accent-soft: #3a1622;
  --slate: #050406; --slate-fg: #fbf7f9; --slate-soft: rgba(255,255,255,.08);
  --good: #3ccf91; --good-soft: #0f2a1f; --warn: #f2b14a; --warn-soft: #2e2210; --bad: #ff6b6b; --bad-soft: #321417;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f0c10; --surface: #19151b; --surface-2: #231e25; --line: #2f2931;
  --fg: #f4eff3; --fg-soft: #b6acb5; --fg-faint: #7c727c;
  --accent: #ff4d7a; --accent-ink: #1a0910; --accent-soft: #3a1622;
  --slate: #050406; --slate-fg: #fbf7f9; --slate-soft: rgba(255,255,255,.08);
  --good: #3ccf91; --good-soft: #0f2a1f; --warn: #f2b14a; --warn-soft: #2e2210; --bad: #ff6b6b; --bad-soft: #321417;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding-inline: 16px; height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 900 26px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.brand b { color: var(--accent); }
.tabs-top { display: none; gap: 4px; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 10px; font-weight: 600; cursor: pointer; color: var(--fg-soft); }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.tabs-bottom { position: fixed; inset: auto 0 0 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-bottom .tab { border-radius: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 9px 4px 10px; min-height: 56px; }
.tabs-bottom .tab[aria-current="page"] { background: none; color: var(--accent); }
.tabs-bottom svg { width: 20px; height: 20px; }
@media (min-width: 640px) { .tabs-top { display: flex; } .tabs-bottom { display: none; } main { padding-bottom: 48px !important; } }

main { max-width: 760px; margin: 0 auto; padding: 18px 16px 110px; display: grid; gap: 14px; }
.stack { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.h1 { font: 800 clamp(30px, 8vw, 42px)/1 var(--font-display); text-transform: uppercase; letter-spacing: .01em; }
.h2 { font-size: 17px; font-weight: 700; }
.sub { color: var(--fg-soft); font-size: 14px; margin: 4px 0 0; max-width: 62ch; }
.eyebrow { font: 700 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-faint); }
.hint { font-size: 12px; color: var(--fg-faint); margin: 0; }
.muted { color: var(--fg-soft); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid-btn { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
@media (min-width: 560px) { .grid-btn.four { grid-template-columns: repeat(4, 1fr); } }

label.lab, .lab { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: var(--fg-soft); }
.req { color: var(--accent); }
.input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; font-size: 16px; min-height: 44px; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { min-height: 88px; resize: vertical; }
.err { color: var(--bad); font-size: 12px; font-weight: 700; margin: 4px 0 0; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.boxed { background: var(--surface-2); border-radius: 11px; padding: 12px; }
input[type=range] { width: 100%; accent-color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 9px 16px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--fg); }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.small { min-height: 34px; padding: 5px 11px; font-size: 13px; }
.btn.block { width: 100%; }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 11px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; text-transform: capitalize; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--fg-soft); }
.pill.rw { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; text-transform: capitalize; }
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.fold > summary { list-style: none; cursor: pointer; padding: 15px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "▾"; color: var(--fg-faint); transition: transform .15s; }
details.fold[open] > summary::after { transform: rotate(180deg); }
details.fold > .fold-body { padding: 0 16px 16px; display: grid; gap: 12px; }
ul.list { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }

.note { border-radius: 11px; padding: 11px 13px; font-size: 13px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.good { background: var(--good-soft); color: var(--good); }
.note b { display: block; margin-bottom: 2px; }

/* Script card */
.script-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.script-title { font: 800 28px/1 var(--font-display); text-transform: uppercase; margin-top: 4px; }
.score { flex: none; text-align: center; border-radius: 14px; padding: 8px 12px; min-width: 74px; }
.score .n { font: 900 44px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.score .of { font: 700 10px var(--font-mono); color: var(--fg-faint); }
.s-good { color: var(--good); } .bg-good { background: var(--good-soft); } .bar-good { background: var(--good); }
.s-warn { color: var(--warn); } .bg-warn { background: var(--warn-soft); } .bar-warn { background: var(--warn); }
.s-bad { color: var(--bad); } .bg-bad { background: var(--bad-soft); } .bar-bad { background: var(--bad); }
.slate { background: var(--slate); color: var(--slate-fg); border-radius: 16px; padding: 16px; display: grid; gap: 12px; position: relative; overflow: hidden; }
.slate::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 8px; background: repeating-linear-gradient(-45deg, var(--slate-fg) 0 10px, transparent 10px 20px); opacity: .9; }
.slate .eyebrow { color: var(--accent); margin-top: 6px; }
.slate .line { font: 800 clamp(26px, 7vw, 34px)/1.05 var(--font-display); text-transform: uppercase; }
.slate .cells { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .slate .cells { grid-template-columns: 1fr 1fr; } }
.slate .cell { background: var(--slate-soft); border-radius: 10px; padding: 9px 10px; font-size: 14px; }
.slate .cell .eyebrow { color: rgba(255,255,255,.55); margin: 0 0 4px; }
.summary { border: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent); background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.summary .eyebrow { color: var(--accent); margin-bottom: 4px; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--line); display: grid; gap: 12px; margin-left: 6px; }
.timeline li { position: relative; font-size: 14px; }
.timeline li::before { content: ""; position: absolute; left: -25px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.tc { font: 700 12px var(--font-mono); color: var(--fg-faint); font-variant-numeric: tabular-nums; }
.say { font-weight: 700; }
.ost { font-size: 12px; color: var(--fg-soft); }
.bars { display: grid; gap: 8px; }
details.bar > summary { list-style: none; cursor: pointer; }
details.bar > summary::-webkit-details-marker { display: none; }
.bar-top { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
.bar-top span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.track { height: 9px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.track > i { display: block; height: 100%; border-radius: 99px; }
details.bar p { margin: 6px 0 0; font-size: 12px; background: var(--surface-2); padding: 8px; border-radius: 8px; }
.kv { display: grid; gap: 6px; font-size: 14px; }
.kv b { font-weight: 700; }
.tile { background: var(--surface-2); border-radius: 11px; padding: 11px; font-size: 14px; min-width: 0; }
.tile .eyebrow { margin-bottom: 4px; }
.tags { color: var(--accent); font-size: 14px; word-break: break-word; }
.foot { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
.vote[aria-pressed="true"].up { background: var(--good); color: #fff; border-color: var(--good); }
.vote[aria-pressed="true"].down { background: var(--bad); color: #fff; border-color: var(--bad); }

/* Progress */
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.steps .done { color: var(--good); } .steps .now { font-weight: 700; } .steps .todo { color: var(--fg-faint); }
.big-status { font-size: 18px; font-weight: 700; }

/* Perf */
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 4px 8px; font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg-soft); }
@media (min-width: 560px) { .metrics { grid-template-columns: repeat(6, minmax(0,1fr)); } }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--fg-soft); font: 11px var(--font-mono); }
.chart .grid { stroke: var(--line); }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.empty { text-align: center; padding: 34px 16px; }
.empty .h2 { font: 800 26px/1.05 var(--font-display); text-transform: uppercase; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 11px; font-weight: 600; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); }
.hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.copybox { width: 100%; min-height: 220px; font: 12px/1.5 var(--font-mono); }
</style>

earch. The winners add a twist or a stake: 'DSP bride', '100-year-old AC', '135 kg to 63 kg', '2BHK for ₹6 lakh'.","[seen] Many top transformation reels (groom makeover 16M, client fat-loss 2.3M, kaju katli making 24M) have no speech at all: music plus visual plus on-screen text. For visual niches a near-silent script is a valid choice. Let on-screen text carry the story.","[seen] An insider truth that breaks a common belief travels well. A wholesaler's '25 saal ka experience… sasta maal sirf patri pe chalta hai' rant (1.7M), 'gold jewellery scam' (4.5M), doctor myth framing (clinic myth/truth ~8x, n=16).","[seen] Real shop moments staged as a 15-second skit can explode. A bargaining skit in a Surat boutique ('Kitne ka hai? ₹15,000. ₹5,000. Pack kar.') got 55M.","[seen] Flops share openers: pity begging ('video pe views nahi aa rahe… comment karo hum saath hain'), slow vlog intros ('Hello doston, welcome to day six'), and 3-minute walkthroughs with no stake in the first 2 seconds.","[data] Hashtag count showed no consistent effect across 25 niches. Keep 6-8 relevant tags in the caption and spend the effort on the hook."],"niches":{"salon":{"do":["[seen] Lead with a specific bride or client identity or twist, not the word 'transformation' ('DSP bride', 'village bride', 'groom makeover', 'mature skin'). Generic 'makeup transformation' titles were 0.26x in their own search [data].","[seen] Price-transparency explainers work when they justify the price with backstage problems solved. 'Why bridal is ₹25k but party is ₹5k' told through one real wedding-day story (blouse loose, dupatta colour mismatch).","[seen] Year-on-year price talk from a known artist got 5.8M. Concrete numbers ('2022 mein 40,000, ab 51,000') beat 'affordable'.","[seen] Near-silent before/after with trending audio is a valid format. Keep on-screen text to the twist."],"avoid":["[data] Leaning on the word 'transformation' alone","[seen] Heavy filters on the reveal","[test] A bare price-list post with no story (0.44x in the price search)"],"winning":["From Competition to Beauty Salon: A Gymnast's Makeup Transformation #shorts (32,000,000 views)","From Braids 💋 Glam: Her Stunning Makeover Journey #makeover #beauty (26,000,000 views)","OLD MONEY AESTHETIC BRIDAL MAKEUP (17,000,000 views)","SHOCKING😱😱 TRANSFORMATION CONTACT: 9003069771 #groommakeup #hairstyle #groom (16,000,000 views)"],"flops":["💄 FREE Bridal Makeup Course for Girls | Learn Bridal Makeup Step by Step✨ (254 views)","✨ Garba Makeup Transition | Navratri Glam Look 💃🔥 | Garba Makeup Transformation #garbamake (405 views)"],"median_views":460000},"restaurant":{"do":["[seen] Open on the one thing only this place does ('dharti ke seene mein tadka', a flaming-leaf serve, superfast poha) plus the price-value ('unlimited thali ₹60'). That got 2.3M.","[seen] Speed and skill close-ups of the cook (superfast poha 14M, cheese-burst omelette 13M) beat dish-name-only posts.","[test] Relatable or comedic food skits did well where present (n=4). Test one per batch."],"avoid":["[data] Leaning on 'famous'/'iconic'/'king of' without showing why (0.12x, n=8)","[seen] Pity or 'please support' hooks","[seen] Dark kitchen lighting"],"winning":["Egg Roti Street Food: The Viral Snack You Can't Miss! ##shorts (28,000,000 views)","Kolkata famous Chhangani club kachori #shorts (18,000,000 views)","SUPERFAST Vicky Tarri Poha 😱🔥#shorts #ashortaday #streetfood (14,000,000 views)","BUTTER CHICKEN😍 | Indian Street Food #shortvideo #shorts #trending #viralvideo (14,000,000 views)"],"flops":["Cleared an 18 Lakh debt, without paying a penny! 😲 The full story #restaurant #delhi #food (63 views)","I Built My Dream Dhaba in India 🇮🇳 | My Story (68 views)"],"median_views":560000},"gym":{"do":["[seen] Exact numbers in the first frame: '135 kg to 63 kg', '2020 vs 2024', '6 months'. These carried most 5M+ videos. A vague 'transformation' label was 0.21x [data].","[seen] A trainer's named client story ('My client Yash's fat loss', 2.3M) is mostly mer. Relatability = local: their area, habits, festivals.\n- B2B: viewer is another business owner (restaurant owner, caterer, contractor, retailer). Relatability = industry-insider: daily operational pain, costs, their customers' complaints. Hashtags are trade/industry tags, not consumer lifestyle tags. CTA asks for a quote, a call, or a WhatsApp message.\n- CREATOR: the inputs describe a personal creator, not a shop. Viewer is a potential follower. Relatability = \"ye toh main hoon\" / \"ye toh mera dost hai\": shared life moments of the target audience. \"The business\" means the creator; props are what the creator already has; the goal replaces the offer. CTA is ONE growth action tied to the goal (follow for part 2, comment a word, save, share with a friend, link in bio). It must not sound like an ad. Hashtags: 2 broad, 3 niche, 1-3 community tags. Prefer formats that can become a series.\n\n# NICHE PLAYBOOK\nTailor everything to the SUB-NICHE, not just the broad category. A bridal makeup studio and a budget college-area salon need different reels.\n{{NICHE_PLAYBOOK}}\n\n# VIRAL PATTERNS (research on real Indian Shorts)\nEvidence from top and flop Shorts in this niche. [data] lines are measured and are strong defaults. [seen] lines are patterns seen in winners. [test] lines are ideas for A/B hooks, not rules. Use them to pick hooks and formats; never copy an example title.\n{{VIRAL_PATTERNS}}\n\n# STEP 1: AUDIENCE & PAIN MAP\n3 pains, 2 desires, 2 objections, 3 relatable references (local for B2C, industry for B2B), 1 key emotion.\n\n# STEP 2: NICHE STRATEGY\nAdapt the playbook to THIS sub-niche: pillars, trust triggers, visuals, 3 niche-specific hooks, seasonal moments, common mistakes, cautions. Don't just copy the playbook.\nName festivals/seasons but never state exact dates unless the user gave them. Festival dates shift every year.\n\n# STEP 3: HOOK ANALYSIS\nOnly if reference hooks are provided. For each: type, first frame, first words, pattern interrupt, curiosity gap, specificity, emotion, niche fit, payoff check, score /10, one-line reason, stronger rewrite.\n\n# HOOK LIBRARY\nThese are hook TYPES. Example lines show the pattern only. Never reuse an example line word for word; write fresh lines specific to this business.\n1. Curiosity gap: \"[Area] mein koi ye nahi batata...\"\n2. Contrarian: \"[Common practice] band karo agar...\"\n3. Pain call-out: \"Agar tumhara [specific problem], ye dekho\"\n4. POV: \"POV: tum [relatable situation]\"\n5. Local/industry call-out: \"[Area/industry] wale dhyan do\"\n6. Number/list: \"[N] cheezein jo [group] galat karta hai\"\n7. Before/after: transformation in the first frame\n8. Mistake: \"Maine [cost] barbaad kiye, tum mat karna\"\n9. Myth-bust: \"Sabko lagta hai [belief]. Galat.\"\n10. Price shock: \"[Price] mein ye? Haan, sach mein\"\n11. Insider secret: \"[N] saal se [business], ek secret batata hoon\"\n12. Challenge/test: \"Kya [cheap thing] [expensive thing] ko hara sakta hai?\"\n13. Customer reaction: genuine reaction in the first frame (only if it will really be filmed)\n14. Question to viewer: \"Tumhe pata hai [surprising question]?\"\n\n# STEP 4: SCRIPTS\nWrite the requested number of scripts. Each uses a DIFFERENT hook type, a DIFFERENT content pillar, and a different emotion.\n\nTiming rules (hard):\n- Hook covers 0-2 seconds. Beats are continuous; each starts where the previous ended.\n- Last beat ends at or before the chosen length.\n- Total spoken words \u003c= length in seconds x 2.5 (30s reel = max 75 words). Extra info goes into on-screen text or gets cut.\n- Hook on-screen text: max 7 words.\n- New visual or new line every 2-3 seconds. No dead air.\n\nEach script: title, hook type, content pillar, emotion, length, on-camera, hook (first-frame visual, on-screen text, spoken line), beats, payoff, ONE CTA, shooting notes (location, props the business already has, phone setup, 3-5 b-roll shots, one editing tip), audio direction, caption ending with a question, 6-8 hashtags, why it could work, biggest risk, reel summary.\n\nAudio: describe the TYPE (trending audio style, voiceover only, original sound, beat type). Never name copyrighted songs. Remind the user to pick a currently trending audio inside the app since trends change weekly.\n\nHashtags: 2 broad, 3 niche, 1-3 local (B2C) or trade (B2B).\n\nREEL SUMMARY: 2-4 plain sentences. What happens from start to finish, who it's for, the feeling the viewer is left with, and the one action we want. The owner should understand the whole reel in 10 seconds before shooting.\n\nDo not score the scripts. A separate critic will.\n\n# STEP 5: TESTING PLAN\n- Which 2 scripts to post first and why\n- 3 alternative hooks for the strongest script (same body, different first 2 seconds)\n- What to watch after 48 hours: 3-second hold rate (low = hook problem), average watch % (low = body problem), shares (relatability), saves (usefulness), profile visits and DMs (CTA and offer)\n- What to change if it flops; what to double down on if it works\n- Realistic posting frequency for this business size\n- Next seasonal moment to prepare for\n\n# NON-NEGOTIABLE RULES\n1. No fake claims, testimonials, reviews or statistics. If a number is needed and wasn't given, write [INSERT REAL NUMBER].\n2. No false scarcity unless the user confirmed it.\n3. Every hook's promise is paid off inside the video.\n4. No copyrighted songs, characters or brand logos.\n5. Shootable by a non-actor on a phone in under 30 minutes with existing props.\n6. Sounds like real people talking. Hinglish = Hindi-English mix in Roman script, never Devanagari, unless the language setting says otherwise.\n7. Follow niche cautions strictly, especially health, beauty, finance, food, real estate.\n8. One video = one idea = one CTA.\n\n# OUTPUT\nReturn ONLY valid JSON matching the schema provided by the app. No markdown, no text outside the JSON. \"hook_analysis\" is an empty array if no reference hooks were given.\n","critic":"# ROLE\nYou are a harsh, experienced short-form content reviewer. You have seen thousands of reels from Indian local businesses flop. You do not inflate scores to be nice. The person relying on you loses money if you are generous.\n\n# INPUT\nBusiness inputs, niche playbook, research-based viral patterns for this niche, the generator's scripts as JSON, and possibly a list of failed automated checks. Use the viral patterns as evidence when scoring hook and niche_fit: a script that relies on a pattern marked as saturated or flopping should lose points unless it adds a clear twist.\n\n# SCORING RUBRIC (total 100)\n- hook (20): stops the scroll in under 1.5s; specific; instant tension or curiosity\n- retention (20): open loop held till the end; new beat every 2-3s; no dead air; payoff lands\n- niche_fit (15): uses a proven pillar and trust trigger for this sub-niche\n- relatability (15): B2C \"ye toh mere area ki baat hai\"; B2B \"ye toh mere business ki problem hai\"; CREATOR \"ye toh main hoon / mera dost hai\"\n- emotion (10): one clear dominant emotion, not five mixed\n- share_save (10): useful enough to save or relatable enough to send to a friend\n- cta (10): one action, natural, right for the mode (B2B asks for quote/call/WhatsApp; CREATOR asks for one growth action tied to the creator's goal)\n\n# CALIBRATION (strict)\n- 90-100: exceptional, rare; would stand out among the best reels in this niche. Most batches have zero here.\n- 75-89: solid; likely above this business's average.\n- 60-74: average; posted and forgotten. Needs sharper hook or tighter body.\n- Below 60: weak; generic, slow, or breaks a rule.\n- If you're about to give every script 80+, stop and look again for what's generic. In a batch of 3+, at least one script usually has a clear weakness.\n- One-line justification for EVERY sub-score. No score without a reason.\n\n# VIOLATION CHECKS\nList per script:\n- Fake claims, invented numbers, fake testimonials\n- False scarcity\n- Hook promise not paid off\n- Too many spoken words for the length (> length x 2.5)\n- Hook on-screen text over 7 words\n- Not shootable by a non-actor in 30 minutes with existing props\n- Breaks a niche caution\n- Generic: any business in any city could post it with only the name changed\n- Wrong mode: B2B script talking to consumers or using consumer lifestyle hashtags; CREATOR script that sounds like a shop ad\n- Devanagari when Hinglish in Roman script was required\nAlso include every failed automated check provided.\n\n# REWRITE RULE\nRewrite any script scoring below 70 OR having any violation. Keep the same id. Fix the specific problems named; don't just reword. Re-score the rewrite honestly and report that final score with \"rewritten\": true.\n\n# ALSO RETURN\nranking (strongest to weakest after rewrites), weakest_note (2 lines), similarity_flags, honesty_note: \"Scores estimate potential. They do not guarantee views.\"\n\n# OUTPUT\nReturn ONLY valid JSON matching the schema provided by the app. No markdown, no text outside the JSON.\n","learnings":"# ROLE\nYou are a blunt short-form content analyst for Indian local businesses. You read aggregated performance stats from reels a business has already posted and turn them into practical direction for the next batch.\n\n# INPUT\nAggregated stats only (no personal data): number of posts, averages grouped by hook type, content pillar, niche and emotion, the correlation between the predicted critic score and real results, and auto-computed insights.\n\n# RULES\n1. Use ONLY the numbers in the input. Never invent, round up, or extrapolate numbers that aren't there.\n2. If the sample is small (fewer than 5 posts, or a group with only 1 post), say the signal is early and frame the bullet as a test, not a conclusion.\n3. Each bullet is one short, specific action for the next batch of scripts (what to do more of, what to drop, what to test). No generic advice like \"post consistently\" unless the data supports it.\n4. Write in simple English with natural Hinglish where it helps. Roman script only.\n5. Exactly 5 bullets, each under 30 words.\n\n# OUTPUT\nReturn ONLY valid JSON: {\"bullets\": [\"string\", \"string\", \"string\", \"string\", \"string\"]}. No markdown, no text outside the JSON.\n","hooks":"# TASK\nAnalyse the reference hooks below for a {{NICHE}} account (a local business or a creator, depending on the niche). Use the HOOK ANALYSIS step and the HOOK LIBRARY from your instructions. Your rewrite must be specific to this niche and must not reuse any hook library example line word for word.\n\nReturn ONLY valid JSON: {\"hook_analysis\": [ ...one object per hook, in the same order... ]} using this schema for each item:\n{{SCHEMA}}\n\nLanguage for rewrites: {{LANGUAGE}}. Roman script only unless the language says otherwise.\n\n# HOOKS\n{{HOOKS}}\n"},"schemas":{"generator":"{\n  \"assumptions\": [\"string\"],\n  \"audience_map\": { \"pains\": [\"string\"], \"desires\": [\"string\"], \"objections\": [\"string\"], \"relatable_refs\": [\"string\"], \"key_emotion\": \"string\" },\n  \"niche_strategy\": { \"pillars\": [\"string\"], \"trust_triggers\": [\"string\"], \"visuals\": [\"string\"], \"niche_hooks\": [\"string\"], \"seasonal_moments\": [\"string\"], \"common_mistakes\": [\"string\"], \"cautions\": [\"string\"] },\n  \"hook_analysis\": [\"\u003chook analysis item>\"],\n  \"scripts\": [\"\u003cscript object>\"],\n  \"testing_plan\": { \"post_first\": [ { \"script_id\": \"string\", \"reason\": \"string\" } ], \"ab_hooks\": [\"string\", \"string\", \"string\"], \"metrics\": \"string\", \"if_flops\": \"string\", \"if_works\": \"string\", \"posting_frequency\": \"string\", \"next_seasonal_moment\": \"string\" }\n}\n","script":"{\n  \"id\": \"s1\",\n  \"title\": \"string\",\n  \"hook_type\": \"string\",\n  \"content_pillar\": \"string\",\n  \"emotion\": \"string\",\n  \"length_sec\": 30,\n  \"on_camera\": \"owner | staff | faceless | customer\",\n  \"hook\": { \"visual\": \"string\", \"on_screen_text\": \"string\", \"spoken\": \"string\" },\n  \"beats\": [ { \"start\": 2, \"end\": 5, \"visual\": \"string\", \"spoken\": \"string\", \"on_screen_text\": \"string\" } ],\n  \"payoff\": \"string\",\n  \"cta\": { \"spoken\": \"string\", \"on_screen_text\": \"string\" },\n  \"shooting\": { \"location\": \"string\", \"props\": [\"string\"], \"phone_setup\": \"string\", \"broll\": [\"string\"], \"editing_tip\": \"string\" },\n  \"audio\": \"string\",\n  \"caption\": \"string\",\n  \"hashtags\": [\"string\"],\n  \"why_it_works\": \"string\",\n  \"biggest_risk\": \"string\",\n  \"reel_summary\": \"string\"\n}\n","hook":"{ \"original\": \"string\", \"type\": \"string\", \"first_frame\": \"string\", \"first_words\": \"string\", \"pattern_interrupt\": \"string\", \"curiosity_gap\": \"string\", \"specificity\": \"string\", \"emotion\": \"string\", \"niche_fit\": \"string\", \"payoff\": \"string\", \"score_10\": 0, \"reason\": \"string\", \"rewrite\": \"string\" }\n","critic":"{\n  \"scores\": [\n    {\n      \"script_id\": \"s1\",\n      \"breakdown\": { \"hook\": 0, \"retention\": 0, \"niche_fit\": 0, \"relatability\": 0, \"emotion\": 0, \"share_save\": 0, \"cta\": 0 },\n      \"justifications\": { \"hook\": \"string\", \"retention\": \"string\", \"niche_fit\": \"string\", \"relatability\": \"string\", \"emotion\": \"string\", \"share_save\": \"string\", \"cta\": \"string\" },\n      \"total\": 0,\n      \"violations\": [\"string\"],\n      \"rewritten\": false\n    }\n  ],\n  \"rewritten_scripts\": [\"\u003cfull script object, same schema as generator scripts, same id as the one it replaces>\"],\n  \"ranking\": [\"s2\", \"s1\", \"s3\"],\n  \"weakest_note\": \"string\",\n  \"similarity_flags\": [\"string\"],\n  \"honesty_note\": \"Scores estimate potential. They do not guarantee views.\"\n}\n"}};

const KEYS = { generations: "rf_generations", feedback: "rf_feedback", performance: "rf_performance", profiles: "rf_profiles", learnings: "rf_learnings", settings: "rf_settings" };
const mem = new Map();

function sGet(k, fb) {
  let raw = null;
  try { raw = localStorage.getItem(k); } catch { storageOk = false; }
  if (raw == null) raw = mem.get(k) ?? null;
  if (raw == null) return fb;
  try { return JSON.parse(raw); } catch { return fb; }
}
function sSet(k, v) {
  const raw = JSON.stringify(v); mem.set(k, raw);
  try { localStorage.setItem(k, raw); } catch { storageOk = false; }
}

async function callJson(prompt, schema, run) {

  const opts = (onText) => ({ modelTier: run.tier, cache: false, signal: run.signal, onText });
  const ask = async (p, onText) => {
    run.calls++;
    try { return { data: await sample.json(p, opts(onText)) }; }
    catch (e) {
      if (e?.code === "invalid_json") return { bad: `Invalid JSON: ${e.message}`, raw: e.text || "" };
      if (e?.code === "not_granted" || e?.code === "sampling_disabled") sampleBlocked = e.code;
      throw new AppError(e?.code || "upstream_error", errCopy(e));
    }
  };

  let firstErr, raw;
  if (r.data !== undefined) { const v = check(schema, r.data); if (v.ok) return v.data; firstErr = `Schema validation failed: ${v.error}`; raw = JSON.stringify(r.data); }
  else { firstErr = r.bad; raw = r.raw; }

  const c = await callJson(criticPrompt({ inputs: rec.inputs, scripts: [fresh], failed: initial, context: keep.map(({ id, title, hook_type, content_pillar, hook }) => ({ id, title, hook_type, content_pillar, hook })) }), CriticS([fresh.id]), run);
  run.stage("finalising");
  const combined = { ...rec.critic, scores: [...rec.critic.scores.filter((s) => s.script_id !== fresh.id), c.scores.find((s) => s.script_id === fresh.id)], rewritten_scripts: c.rewritten_scripts.filter((s) => s.id === fresh.id), similarity_flags: [...rec.critic.similarity_flags, ...c.similarity_flags] };
  const m = mergeCritic([...keep, fresh], combined);

}

/* ---------------- stats (port of lib/stats.ts) ---------------- */
const DIMS = [["hook_type", "Hook type", "hooks"], ["content_pillar", "Content pillar", "reels"], ["niche", "Niche", "reels"], ["emotion", "Emotion", "reels"]];
const mean = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0);
const r1 = (n) => Math.round(n * 10) / 10;
function pearson(xs, ys) {
  const n = Math.min(xs.length, ys.length); if (n < 3) return null;
  const mx = mean(xs.slice(0, n)), my = mean(ys.slice(0, n)); let num = 0, dx = 0, dy = 0;
  for (let i = 0; i < n; i++) { const a = xs[i] - mx, b = ys[i] - my; num += a * b; dx += a * a; dy += b * b; }
  return dx && dy ? Math.round((num / Math.sqrt(dx * dy)) * 100) / 100 : null;
}
function describeR(r) { if (r == null) return "not enough data"; const a = Math.abs(r); if (a < 0.2) return "no real relationship"; return `${a >= 0.7 ? "strong" : a >= 0.4 ? "moderate" : "weak"} ${r > 0 ? "positive" : "negative"}`; }
function groupBy(es, dim) {
  const g = new Map();
  for (const e of es) { const label = (e[dim] || "unknown").trim(); const k = label.toLowerCase(); const x = g.get(k) || { label, items: [] }; x.items.push(e); g.set(k, x); }
  return [...g.values()].map(({ label, items }) => ({ group: label, posts: items.length, avg_views: r1(mean(items.map((i) => i.views))), avg_saves: r1(mean(items.map((i) => i.saves))), avg_shares: r1(mean(items.map((i) => i.shares))), avg_hold_rate: r1(mean(items.map((i) => i.hold_rate_3s))), avg_watch_pct: r1(mean(items.map((i) => i.avg_watch_pct))), avg_predicted_score: r1(mean(items.map((i) => i.predicted_score))) })).sort((a, b) => b.posts - a.posts || b.avg_views - a.avg_views);
}
function insights(es) {
  const out = []; if (!es.length) return out;
  const noun = { avg_saves: "saves", avg_views: "views" };
  for (const [dim, , n] of DIMS) {
    if (dim === "niche" && new Set(es.map((e) => e.niche.toLowerCase())).size < 2) continue;
    const gs = groupBy(es, dim); if (gs.length < 2) continue;
    for (const m of ["avg_saves", "avg_views"]) {
      const s = [...gs].sort((a, b) => b[m] - a[m]); const best = s[0], worst = s[s.length - 1];
      if (worst[m] <= 0) { if (best[m] > 0) out.push(`"${best.group}" ${n} got ${best[m]} ${noun[m]} on average while "${worst.group}" ${n} got none (${best.posts} vs ${worst.posts} posts).`); continue; }
      const ratio = best[m] / worst[m];
      if (ratio >= 1.2) out.push(`"${best.group}" ${n} averaged ${ratio.toFixed(1)}x more ${noun[m]} than "${worst.group}" ${n} (${best.posts} vs ${worst.posts} posts).`);
    }
  }
  const sc = es.map((e) => e.predicted_score);
  const rv = pearson(sc, es.map((e) => e.views)), rs = pearson(sc, es.map((e) => e.saves));
  if (rv != null) out.push(`Critic score vs views: r = ${rv} (${describeR(rv)}) across ${es.length} posts.`);
  if (rs != null) out.push(`Critic score vs saves: r = ${rs} (${describeR(rs)}).`);
  const lh = es.filter((e) => e.hold_rate_3s > 0 && e.hold_rate_3s < 40).length;
  if (lh) out.push(`${lh} of ${es.length} posts held under 40% of viewers past 3 seconds. That's a hook problem: test new first frames.`);
  const lw = es.filter((e) => e.avg_watch_pct > 0 && e.avg_watch_pct < 30).length;
  if (lw) out.push(`${lw} of ${es.length} posts had average watch under 30%. That's a body problem: cut slower beats.`);
  if (es.length < 5) out.push(`Only ${es.length} post${es.length > 1 ? "s" : ""} logged so far. Treat these patterns as early signals, not rules.`);
  return out;
}
function aggregate(es) {
  const sc = es.map((e) => e.predicted_score);
  return { total_posts: es.length, correlation_score_views: pearson(sc, es.map((e) => e.views)), correlation_score_saves: pearson(sc, es.map((e) => e.saves)),
    by_hook_type: groupBy(es, "hook_type"), by_pillar: groupBy(es, "content_pillar"), by_niche: groupBy(es, "niche"), by_emotion: groupBy(es, "emotion"), insights: insights(es) };
}

/* ---------------- self-improvement loop (port of lib/learning.ts) ---------------- */
function buildLearningContext(f) {
  const key = clientKey(f.business_name), label = nicheLabel(f), parts = [];
  const learn = key ? store.learnings(key) : null;
  if (learn?.bullets?.length) parts.push(`Learnings for this client from ${learn.posts} posted reels:`, ...learn.bullets.map((b) => `- ${b}`));
  const nichePosts = store.perf().filter((p) => p.niche.toLowerCase() === label.toLowerCase());
  if (nichePosts.length >= 3) { const ins = insights(nichePosts).slice(0, 5); if (ins.length) parts.push("", `What your own ${nichePosts.length} posted ${label} reels show:`, ...ins.map((x) => `- ${x}`)); }
  const fb = store.fb(), liked = [], disliked = [];
  for (const g of store.gens()) {
    if (g.inputs.niche !== f.niche) continue;
    for (const s of g.output.scripts) {
      const v = fb[`${g.id}:${s.id}`]; if (!v?.vote) continue;
      const line = `"${s.hook.spoken}" (${s.hook_type}, ${s.content_pillar})${v.note ? `. Note: ${v.note}` : ""}`;
      if (v.vote === "up" && liked.length < 4) liked.push(line);
      if (v.vote === "down" && disliked.length < 4) disliked.push(line);
    }
  }
  if (liked.length) parts.push("", "Hooks the user LIKED (write in this spirit, don't copy):", ...liked.map((x) => `- ${x}`));
  if (disliked.length) parts.push("", "Hooks the user DISLIKED (avoid what made these weak):", ...disliked.map((x) => `- ${x}`));
  return { text: parts.join("\n").trim().slice(0, 3800), counts: { learnings: learn?.bullets?.length || 0, nichePosts: nichePosts.length, liked: liked.length, disliked: disliked.length } };
}

function scatter(es, metric) {
  const W = 340, H = 220, L = 46, B = 30, T = 10, R = 10;
  const ys = es.map((e) => e[metric]); const ymax = Math.max(10, ...ys);
  const step = Math.pow(10, Math.floor(Math.log10(ymax))); const top = Math.ceil(ymax / step) * step;
  const x = (v) => L + (v / 100) * (W - L - R), y = (v) => T + (1 - v / top) * (H - T - B);
  const yt = [0, top / 2, top];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Critic score versus ${metric}">
    ${[0, 25, 50, 75, 100].map((v) => `<line class="grid" x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${H - B}"/><text x="${x(v)}" y="${H - B + 14}" text-anchor="middle">${v}</text>`).join("")}
    ${yt.map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? `${r1(v / 1000)}k` : v}</text>`).join("")}
    <text x="${(L + W - R) / 2}" y="${H - 2}" text-anchor="middle">critic score</text>
    ${es.map((e) => `<circle class="dot" cx="${x(e.predicted_score)}" cy="${y(e[metric])}" r="6"><title>${h(e.title)}: score ${e.predicted_score}, ${e[metric]} ${metric}</title></circle>`).join("")}</svg>`;
}
function viewPerformance() {
  const all = store.perf(), gens = store.gens();
  const clients = [...new Map(all.map((e) => [e.client_key, e.business_name])).entries()];
  const es = ui.perfClient ? all.filter((e) => e.client_key === ui.perfClient) : all;
  const r = pearson(es.map((e) => e.predicted_score), es.map((e) => e[ui.perfMetric]));
  const learn = ui.perfClient ? store.learnings(ui.perfClient) : null;
  const picker = gens.length ? `<details class="fold"><summary>Log a posted script</summary><div class="fold-body"><select class="input" id="pick-gen" aria-label="Generation"><option value="">Choose a generation…</option>${gens.map((g) => `<option value="${h(g.id)}" ${ui.pickGen === g.id ? "selected" : ""}>${h(g.inputs.business_name)} · ${h(fmtDate(g.created_at))}</option>`).join("")}</select>${ui.pickGen && store.gen(ui.pickGen) ? store.gen(ui.pickGen).output.scripts.map((s) => `<button class="btn block" style="justify-content:space-between" data-act="pick-script" data-g="${h(ui.pickGen)}" data-id="${h(s.id)}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(s.title)}</span><span class="hint">${scoreFor(store.gen(ui.pickGen), s.id)?.total ?? "–"}</span></button>`).join("") : ""}</div></details>` : "";
  return `<div><h1 class="h1">Performance</h1><p class="sub">Log what happened after posting. See if the critic's predictions hold up, and what to make next.</p></div>
  ${ui.logging ? logForm() : ""}${picker}
  ${!all.length ? `<section class="card empty"><div class="h2">Abhi tak kuch post nahi kiya?</div><p class="muted">After you post a reel, tap <b>I posted this</b> on its script card, or use “Log a posted script” above. Add the numbers after about 48 hours and this dashboard shows what actually works.</p>${gens.length ? "" : '<button class="btn primary" data-tab="generate">Generate scripts first</button>'}</section>` : `
  <section class="card"><div class="row"><label class="lab" for="perf-client" style="margin:0">Client</label><select class="input" id="perf-client" style="flex:1;min-width:0"><option value="">All clients (${all.length} posts)</option>${clients.map(([k, n]) => `<option value="${h(k)}" ${ui.perfClient === k ? "selected" : ""}>${h(n)} (${all.filter((e) => e.client_key === k).length})</option>`).join("")}</select></div></section>
  <section class="card"><div class="row" style="justify-content:space-between"><h2 class="h2">Predicted vs actual</h2><div class="seg">${["views", "saves"].map((m) => `<button data-act="metric" data-v="${m}" aria-pressed="${ui.perfMetric === m}">${m}</button>`).join("")}</div></div>
    ${scatter(es, ui.perfMetric)}<p style="margin:0;font-size:14px">Correlation (r): <b style="font-family:var(--font-mono)">${r ?? "–"}</b> · ${describeR(r)}${r == null ? ' <span class="hint">(needs 3+ posts with different scores)</span>' : ""}</p></section>
  <section class="card"><h2 class="h2">Auto-insights</h2>${listHtml(insights(es))}</section>
  <section class="card"><h2 class="h2">Learnings for the next batch</h2>
    ${!ui.perfClient ? `<p class="muted" style="margin:0">Pick a client above. Learnings are saved per client and offered on that client's next generation.</p>` : `${learn ? `${listHtml(learn.bullets)}<p class="hint">From ${learn.posts} posts on ${h(fmtDate(learn.created_at))}.</p>` : ""}${ui.learnErr ? errorBox(ui.learnErr) : ""}<button class="btn primary" data-act="learn" ${ui.learnBusy ? "disabled" : ""}>${ui.learnBusy ? '<span class="spin" aria-hidden="true"></span> Data ko nichod rahe hain...' : learn ? "Refresh learnings" : "Get learnings"}</button><p class="hint">Only aggregated numbers go to Claude: no names, captions or dates.</p>`}</section>
  <section class="card"><h2 class="h2">Averages by</h2><div class="chips">${DIMS.map(([k, l]) => `<button class="chip-btn" data-act="dim" data-v="${k}" aria-pressed="${ui.perfDim === k}" style="text-transform:none">${l}</button>`).join("")}</div>
    ${groupBy(es, ui.perfDim).map((g) => `<div class="tile"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(g.group)}</b><span class="hint">${g.posts} post${g.posts > 1 ? "s" : ""}</span></div><div class="metrics" style="margin-top:6px"><span>👁 ${g.avg_views.toLocaleString("en-IN")}</span><span>🔖 ${g.avg_saves}</span><span>↗ ${g.avg_shares}</span><span>3s ${g.avg_hold_rate}%</span><span>⏱ ${g.avg_watch_pct}%</span><span>★ ${g.avg_predicted_score}</span></div></div>`).join("")}</section>
  <section class="card"><h2 class="h2">All posted scripts</h2>${es.map((e) => `<div class="tile" style="background:none;border:1px solid var(--line)"><div class="script-head"><div style="min-width:0"><b>${h(e.title)}</b><div class="hint">${h(e.business_name)} · ${h(e.platform)} · ${h(e.post_date)} · ${h(e.hook_type)}</div></div><span class="s-${scoreCls(e.predicted_score)}" style="font:900 26px/1 var(--font-display)">${e.predicted_score}</span></div>
    <div class="metrics" style="margin:8px 0"><span>👁 ${Number(e.views).toLocaleString("en-IN")}</span><span>3s ${e.hold_rate_3s}%</span><span>⏱ ${e.avg_watch_pct}%</span><span>❤ ${e.likes}</span><span>💬 ${e.comments}</span><span>↗ ${e.shares}</span><span>🔖 ${e.saves}</span><span>👤 ${e.profile_visits}</span><span>✉ ${e.dms}</span></div>
    <div class="row"><button class="btn small" data-act="edit-log" data-id="${h(e.id)}">Edit</button>${armBtn("del-log", e.id, "Delete", "Tap again to delete", "btn small")}</div></div>`).join("")}</section>`}`;
}

/* ---------------- render: history + settings ---------------- */
function viewHistory() {
  const gens = store.gens();
  return `<div><h1 class="h1">History</h1><p class="sub">Your last 50 generations, saved in this browser. Export from Settings to keep a backup.</p></div>${storageNote()}
  ${!gens.length ? `<section class="card empty"><div class="h2">Khaali hai abhi</div><p class="muted">Nothing generated yet. Fill the form and your scripts will show up here.</p><button class="btn primary" data-tab="generate">Fill the form</button></section>` :
  gens.map((g) => { const top = Math.max(0, ...g.critic.scores.map((s) => s.total)), c = scoreCls(top); return `<section class="card"><div class="script-head"><div style="min-width:0"><b style="font-size:18px">${h(g.inputs.business_name)}</b><div class="hint">${h([nicheLabel(g.inputs), placeText(g.inputs)].filter(Boolean).join(" · "))}</div><div class="hint">${h(fmtDate(g.created_at))} · ${g.output.scripts.length} scripts · ${g.mode}</div></div><div class="score bg-${c}" style="min-width:60px;padding:6px 10px"><div class="n s-${c}" style="font-size:30px">${top}</div><div class="of">TOP</div></div></div>
  <div class="grid-btn" style="grid-template-columns:repeat(3,1fr)"><button class="btn primary" data-act="open" data-id="${h(g.id)}">Open</button><button class="btn" data-act="duplicate" data-id="${h(g.id)}">Duplicate</button>${armBtn("del-gen", g.id, "Delete", "Tap again")}</div></section>`; }).join("")}`;
}
function viewSettings() {
  const s = store.settings();
  return `<h1 class="h1">Settings</h1>${storageNote()}
  <section class="card"><h2 class="h2">Defaults</h2>
    <div><span class="lab">Claude model tier</span><div class="seg">${[["default", "Balanced"], ["complex", "Most capable"]].map(([k, l]) => `<button data-act="set-tier" data-v="${k}" aria-pressed="${s.tier === k}">${l}</button>`).join("")}</div><p class="hint">Most capable thinks longer and uses more of your plan. Balanced is fine for most batches.</p></div>
    <div><label class="lab" for="st-count">Default number of scripts: <span id="stCountOut">${s.default_script_count}</span></label><input type="range" id="st-count" min="1" max="5" value="${s.default_script_count}"></div>
    <div><label class="lab" for="st-lang">Default language</label><select class="input" id="st-lang">${Object.entries(LANG_LABELS).map(([k, l]) => `<option value="${k}" ${s.default_language === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
  </section>
  <section class="card"><h2 class="h2">Your data</h2><p class="muted" style="margin:0;font-size:14px">History, feedback, performance logs, client profiles and learnings live in this browser only. Export regularly so nothing is lost.</p>
    <div class="grid-btn" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"><button class="btn" data-act="export">Export all data</button><button class="btn" data-act="import">Import data</button>${armBtn("clear", "all", "Clear all data", "Pakka? Tap again", "btn danger")}</div>
    <p class="hint">Import merges with what's already here; matching items are replaced by the imported copy.</p></section>
  <section class="card"><h2 class="h2">How scoring works</h2><p class="muted" style="margin:0;font-size:14px">A writer pass drafts the scripts. Code then checks timing, word counts, hashtags, CTAs and script. A separate critic pass scores each script out of 100 (hook 20, retention 20, niche fit 15, relatability 15, emotion 10, share/save 10, CTA 10), rewrites anything under 70 or breaking a rule, and re-scores it. Scores estimate potential. They do not guarantee views.</p><p class="muted" style="margin:0;font-size:14px">Both passes also read a viral pattern library built from ${h(DATA.viral.source.split(" (")[0])}, plus what it learns from your own 👍/👎 and posted results.</p><p class="hint">Prompt version ${h(DATA.promptVersion)}</p></section>`;
}

/* ---------------- actions ---------------- */
function readForm() {
  if (!ui.form) return;
  document.querySelectorAll("[data-f]").forEach((el) => {
    const k = el.dataset.f;
    ui.form[k] = el.type === "checkbox" ? el.checked : el.type === "range" ? Number(el.value) : el.value;
  });
}
async function runJob(kind, fn) {
  ui.failure = null; ui.lastAct = kind;
  const ctl = new AbortController(); ui.ctl = ctl;
  const run = { tier: store.settings().tier, signal: ctl.signal, calls: 0, retries: 0, onText: null, stage: (s) => { if (ui.busy) { ui.busy.stage = s; render(); } } };
  ui.busy = { stage: "audience" }; render(); window.scrollTo({ top: 0 });
  try {
    const rec = await fn(run);
    store.saveGen(rec); ui.resultId = rec.id; ui.tab = "results"; ui.busy = null; render(); window.scrollTo({ top: 0 });
  } catch (e) {
    ui.busy = null;
    if (e?.code !== "cancelled") ui.failure = e instanceof AppError ? e.message : ERR_COPY.upstream_error;
    render();
  } finally { ui.ctl = null; }
}
function arm(key) { if (ui.armed === key) { ui.armed = null; return true; } ui.armed = key; render(); setTimeout(() => { if (ui.armed === key) { ui.armed = null; render(); } }, 4000); return false; }

document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("[data-tab],[data-act]"); if (!t || t.tagName === "SELECT" || (t.tagName === "INPUT" && t.type !== "checkbox")) return;
  if (t.dataset.tab) { readForm(); ui.tab = t.dataset.tab; ui.modal = null; ui.armed = null; render(); window.scrollTo({ top: 0 }); return; }
  const act = t.dataset.act, id = t.dataset.id;
  const rec = ui.resultId ? store.gen(ui.resultId) : null;
  switch (act) {
    case "oncam": readForm(); ui.form.on_camera = t.dataset.v; render(); break;
    case "kind": {
      readForm(); const k = t.dataset.v; if ((ui.form.kind || "business") === k) break;
      ui.form = { ...ui.form, kind: k, niche: k === "creator" ? CREATORS[0].id : NICHES[0].id, on_camera: k === "creator" ? "self" : "owner", b2b: false };
      ui.errors = {}; render(); break;
    }
    case "tone": { readForm(); const v = t.dataset.v; ui.form.tones = ui.form.tones.includes(v) ? ui.form.tones.filter((x) => x !== v) : [...ui.form.tones, v]; render(); break; }
    case "toggle-save-profile": ui.saveProfile = t.checked; break;
    case "toggle-use-past": ui.usePast = t.checked; break;
    case "del-profile": if (arm(`del-profile:${id}`)) { store.delProfile(id); toast("Profile deleted"); } render(); break;
    case "generate": {
      readForm();
      const { inputs, errs } = formToInputs(ui.form); ui.errors = errs;
      if (Object.keys(errs).length) { render(); $(`#f-${Object.keys(errs)[0]}`)?.focus(); return; }
      if (ui.saveProfile) store.saveProfile(inputs);
      const learnCtx = buildLearningContext(ui.form);
      const past = ui.usePast && learnCtx.text ? learnCtx.text : "";
      runJob("generate", (run) => runPipeline(inputs, past, run)); break;
    }
    case "stop": ui.ctl?.abort(); break;
    case "regenerate": if (rec) runJob("regenerate", (run) => runPipeline(rec.inputs, "", run)); break;
    case "regen-weakest": if (rec && rec.output.scripts.length > 1) runJob("regen-weakest", (run) => regenerateWeakest(rec, run)); break;
    case "copy-all": if (rec) copy(allText(rec)); break;
    case "download-md": if (rec) saveFile(`${slug(rec.inputs.business_name)}-reels.md`, toMarkdown(rec)); break;
    case "copy-script": { const s = rec?.output.scripts.find((x) => x.id === id); if (s) copy(scriptText(s, scoreFor(rec, id))); break; }
    case "copy-caption": { const s = rec?.output.scripts.find((x) => x.id === id); if (s) copy(captionText(s)); break; }
    case "copy-rewrite": { const list = ui.tab === "hooks" ? ui.hooks.res : rec?.output.hook_analysis; const x = list?.[Number(t.dataset.i)]; if (x) copy(x.rewrite); break; }
    case "vote": { const k = `${rec.id}:${id}`, cur = store.fb()[k] || {}; const v = cur.vote === t.dataset.v ? null : t.dataset.v; store.setFb(k, { vote: v, note: cur.note || "" }); render(); $(`#script-${CSS.escape(id)}`)?.scrollIntoView({ block: "nearest" }); break; }
    case "posted": ui.logging = { genId: rec.id, scriptId: id, existing: store.perf().find((e) => e.generation_id === rec.id && e.script_id === id) }; ui.tab = "performance"; render(); window.scrollTo({ top: 0 }); break;
    case "pick-script": ui.logging = { genId: t.dataset.g, scriptId: id, existing: store.perf().find((e) => e.generation_id === t.dataset.g && e.script_id === id) }; render(); window.scrollTo({ top: 0 }); break;
    case "edit-log": { const e = store.perf().find((x) => x.id === id); if (e) { ui.logging = { genId: e.generation_id, scriptId: e.script_id, existing: e }; render(); window.scrollTo({ top: 0 }); } break; }
    case "cancel-log": ui.logging = null; render(); break;
    case "save-log": saveLog(); break;
    case "del-log": if (arm(`del-log:${id}`)) { store.delPerf(id); toast("Deleted"); } render(); break;
    case "metric": ui.perfMetric = t.dataset.v; render(); break;
    case "dim": ui.perfDim = t.dataset.v; render(); break;
    case "learn": getLearnings(); break;
    case "analyse": analyseHooks(); break;
    case "open": ui.resultId = id; ui.failure = null; ui.tab = "results"; render(); window.scrollTo({ top: 0 }); break;
    case "duplicate": { const g = store.gen(id); if (g) { ui.form = toForm(g.inputs); ui.errors = {}; ui.tab = "generate"; render(); window.scrollTo({ top: 0 }); toast("Form filled from that generation"); } break; }
    case "del-gen": if (arm(`del-gen:${id}`)) { store.delGen(id); toast("Deleted. Performance logs are kept."); } render(); break;
    case "set-tier": store.saveSettings({ ...store.settings(), tier: t.dataset.v }); render(); break;
    case "export": saveFile(`reelforge-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(exportAll(), null, 2)); break;
    case "import": $("#importFile").click(); break;
    case "clear": if (arm("clear:all")) { clearAll(); ui.form = null; toast("All data cleared"); } render(); break;
    case "modal-select": { const ta = $("#modalText"); ta.focus(); ta.select(); break; }
    case "modal-close": ui.modal = null; render(); break;
  }
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset.f === "script_count") { const o = $("#countOut"); if (o) o.textContent = el.value; }
  if (el.dataset.h) { ui.hooks[el.dataset.h] = el.value; if (el.dataset.h === "text") { const n = el.value.split("\n").map((x) => x.trim()).filter(Boolean).length; $("#hk-count").textContent = `${n}/10 hooks${n > 10 ? " · remove some" : ""}`; } }
  if (el.id === "st-count") { $("#stCountOut").textContent = el.value; store.saveSettings({ ...store.settings(), default_script_count: Number(el.value) }); }
  if (el.dataset.f === "business_name") { ui.form.business_name = el.value; const slot = $("#learnSlot"); if (slot) slot.innerHTML = learnSlot(currentLearnings()); }
});
document.addEventListener("change", async (ev) => {
  const el = ev.target;
  if (el.dataset.f === "niche") { readForm(); const n = NICHES.find((x) => x.id === el.value); if (n) ui.form.b2b = n.mode === "B2B"; render(); }
  else if (el.id === "profile") { const p = store.profiles().find((x) => x.key === el.value); if (p) { ui.form = toForm(p.inputs); ui.errors = {}; ui.saveProfile = false; render(); toast(`Loaded ${p.name}`); } }
  else if (el.dataset.h === "niche") { ui.hooks.niche = el.value; render(); }
  else if (el.dataset.act === "fb-note") { const rec = store.gen(ui.resultId); const k = `${rec.id}:${el.dataset.id}`; const cur = store.fb()[k] || {}; store.setFb(k, { vote: cur.vote || null, note: el.value.slice(0, 300) }); toast("Note saved"); }
  else if (el.id === "perf-client") { ui.perfClient = el.value; ui.learnErr = null; render(); }
  else if (el.id === "pick-gen") { ui.pickGen = el.value; render(); $("#pick-gen")?.closest("details")?.setAttribute("open", ""); }
  else if (el.id === "st-lang") { store.saveSettings({ ...store.settings(), default_language: el.value }); toast("Saved"); }
  else if (el.id === "importFile") {
    const f = el.files?.[0]; el.value = ""; if (!f) return;
    try { const r = importAll(JSON.parse(await f.text())); toast(r.message); ui.form = null; render(); } catch { toast("Couldn't read that file. Is it a ReelForge JSON export?"); }
  }
});

function saveLog() {
  const L = ui.logging, g = store.gen(L.genId), s = g?.output.scripts.find((x) => x.id === L.scriptId); if (!s) return;
  const nums = {};
  for (const [k, l, max] of NUM_FIELDS) {
    const raw = $(`#pf-${k}`).value.trim(); const v = raw === "" ? 0 : Number(raw);
    if (!Number.isFinite(v) || v < 0 || (max != null && v > max)) { $("#pf-err").textContent = `${l} must be a number${max != null ? ` between 0 and ${max}` : " of 0 or more"}.`; return; }
    nums[k] = v;
  }
  if (!$("#pf-views").value.trim()) { $("#pf-err").textContent = "Views is required."; return; }
  store.upPerf({ id: L.existing?.id ?? uid("p"), generation_id: g.id, script_id: s.id, business_name: g.inputs.business_name, client_key: clientKey(g.inputs.business_name), niche: nicheLabel(g.inputs), title: s.title, hook_type: s.hook_type, content_pillar: s.content_pillar, emotion: s.emotion, predicted_score: scoreFor(g, s.id)?.total ?? 0, prompt_version: g.prompt_version, platform: $("#pf-platform").value, post_date: $("#pf-date").value, created_at: L.existing?.created_at ?? new Date().toISOString(), ...nums });
  ui.logging = null; toast("Logged"); render();
}

async function analyseHooks() {
  const H = ui.hooks, list = H.text.split("\n").map((x) => x.trim().slice(0, 200)).filter(Boolean);
  if (!list.length) { H.err = "Paste at least one hook."; render(); return; }
  if (list.length > 10) { H.err = "Keep it to 10 hooks or fewer."; render(); return; }
  if (H.niche === "other" && !H.custom.trim()) { H.err = "Type the custom niche first."; render(); return; }
  H.busy = true; H.err = null; render();
  try {
    const run = { tier: store.settings().tier, calls: 0, retries: 0 };
    const out = await callJson(hooksPrompt(list, nicheLabel({ niche: H.niche, custom_niche: H.custom.trim() }), H.language), S.obj({ hook_analysis: S.arr(HookS, { min: 1 }) }), run);
    H.res = out.hook_analysis;
  } catch (e) { H.err = e instanceof AppError ? e.message : ERR_COPY.upstream_error; }
  H.busy = false; render();
}

async function getLearnings() {
  const es = store.perf().filter((e) => e.client_key === ui.perfClient); if (!es.length) return;
  ui.learnBusy = true; ui.learnErr = null; render();
  try {
    const run = { tier: store.settings().tier, calls: 0, retries: 0 };
    const out = await callJson(`${DATA.prompts.learnings}\n\n---\n# AGGREGATED STATS\n${JSON.stringify(aggregate(es), null, 2)}`, S.obj({ bullets: S.arr(S.str(), { min: 1 }) }), run);
    store.setLearnings(ui.perfClient, { bullets: out.bullets.slice(0, 5), created_at: new Date().toISOString(), posts: es.length });
  } catch (e) { ui.learnErr = e instanceof AppError ? e.message : ERR_COPY.upstream_error; }
  ui.learnBusy = false; render();
}

sGet(KEYS.settings, {}); // probe storage once so the warning shows on first paint
ui.hooks.language = store.settings().default_language;
render();
</script>
